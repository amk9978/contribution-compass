[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contribution-compass"
version = "0.3.0"
description = "Evidence-first open-source updates and contribution discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "mcp>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
contribution-compass = "contribution_compass.controllers.cli:main"
contribution-compass-mcp = "contribution_compass.controllers.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contribution_compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contribution_compass"]
