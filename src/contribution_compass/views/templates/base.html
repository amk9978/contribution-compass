<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="index,follow">
  <meta name="color-scheme" content="dark light">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Contribution Compass">
  <meta property="og:title" content="{{ page.title }} · Contribution Compass">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ site.site_url }}/assets/social-preview.png">
  <meta property="og:image:alt" content="Contribution Compass — follow important projects and find where to help">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} · Contribution Compass">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ site.site_url }}/assets/social-preview.png">
  <title>{{ page.title }} · Contribution Compass</title>
  <link rel="canonical" href="{{ page.canonical_url }}">
  <link rel="icon" href="{{ site.site_url }}/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/json" title="Machine data" href="{{ page.api_url }}">
  <link rel="alternate" type="application/feed+json" title="JSON Feed" href="{{ site.site_url }}/feed.json">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.site_url }}/feed.xml">
  <link rel="stylesheet" href="{{ site.site_url }}/assets/styles.css">
  <link rel="stylesheet" href="{{ site.site_url }}/assets/contributions.css">
  <link rel="stylesheet" href="{{ site.site_url }}/assets/personalize.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ site.site_url }}/"><span class="brand-mark">⌖</span><span>contribution/<strong>compass</strong></span></a>
    <nav class="topnav"><a href="{{ site.site_url }}/projects/">Projects</a><a href="{{ site.site_url }}/contribute/">Contribute</a><a href="{{ site.site_url }}/news/">News</a><a href="{{ site.site_url }}/personalize/">My Compass</a><a class="secondary-nav" href="{{ site.site_url }}/api/v1/index.json">Data</a><a class="secondary-nav" href="{{ site.site_url }}/feed.xml">RSS</a><a class="secondary-nav" href="{{ site.repository_url }}">GitHub</a><button class="theme-toggle" type="button" aria-label="Toggle color theme">◐</button></nav>
  </header>
  {% block content %}{% endblock %}
  <footer class="footer"><span>Direct GitHub and Hacker News evidence · No generated analysis</span><span><a href="{{ site.site_url }}/llms.txt">LLM guide</a> · <a href="{{ site.repository_url }}/blob/main/docs/MCP.md">MCP</a></span></footer>
  <script src="{{ site.site_url }}/assets/app.js" defer></script>
  {% for script in page.scripts %}<script src="{{ site.site_url }}/assets/{{ script }}" defer></script>{% endfor %}
</body>
</html>
