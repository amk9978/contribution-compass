{% extends "base.html" %}
{% block content %}<main class="shell detail-page"><section class="detail-hero"><span class="eyebrow">COLLECTION SNAPSHOT</span><h1>{{ date }}</h1><p>Browse factual updates by project group.</p></section><div class="group-grid">{% for group in groups %}<a class="group-card" href="{{ site.site_url }}/updates/{{ date }}/{{ group.id }}/"><div class="group-title"><h3>{{ group.name }}</h3><strong>{{ group.signal_count }}</strong></div><div class="group-meta"><span>{{ group.project_count }} projects</span><span>Explore →</span></div></a>{% endfor %}</div></main>{% endblock %}
