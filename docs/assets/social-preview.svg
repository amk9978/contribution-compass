<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Contribution Compass</title>
  <desc id="description">Follow important open-source projects and find evidence-backed places to help.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c0f"/>
      <stop offset="1" stop-color="#10171b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63ff8f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#63ff8f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1040" cy="315" r="310" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 55)">
      <path d="M10 0 13 7 20 10 13 13 10 20 7 13 0 10 7 7Z" fill="#63ff8f"/>
      <text x="32" y="17" fill="#f2f5f7" font-size="25" font-weight="500">contribution/<tspan font-weight="750">compass</tspan></text>
    </g>

    <text x="64" y="205" fill="#63ff8f" font-size="17" font-weight="700" letter-spacing="3">OPEN-SOURCE PROJECT INTELLIGENCE</text>
    <text x="64" y="290" fill="#f4f7f9" font-size="62" font-weight="750">Follow important projects.</text>
    <text x="64" y="365" fill="#9eabb5" font-size="62" font-weight="650">Find where to help.</text>
    <text x="67" y="418" fill="#b9c5cd" font-size="23">Evidence-backed updates and contribution leads—with direct source trails.</text>

    <g transform="translate(64 500)" font-size="17" font-weight="600">
      <g><rect width="162" height="48" rx="24" fill="#151d22" stroke="#2c3941"/><text x="24" y="30" fill="#dbe3e8">GitHub Actions</text></g>
      <g transform="translate(178)"><rect width="136" height="48" rx="24" fill="#151d22" stroke="#2c3941"/><text x="24" y="30" fill="#dbe3e8">Static Pages</text></g>
      <g transform="translate(330)"><rect width="151" height="48" rx="24" fill="#151d22" stroke="#2c3941"/><text x="24" y="30" fill="#dbe3e8">JSON + RSS</text></g>
      <g transform="translate(497)"><rect width="99" height="48" rx="24" fill="#151d22" stroke="#2c3941"/><text x="27" y="30" fill="#dbe3e8">MCP</text></g>
      <g transform="translate(612)"><rect width="142" height="48" rx="24" fill="#142119" stroke="#3f7d52"/><text x="24" y="30" fill="#75ff9b">No AI key</text></g>
    </g>

    <g transform="translate(1030 305)">
      <circle r="148" fill="#0b1114" stroke="#34444c" stroke-width="2"/>
      <circle r="108" fill="none" stroke="#63ff8f" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 10"/>
      <circle r="52" fill="none" stroke="#63ff8f" stroke-opacity="0.4"/>
      <path d="M0-119 22-23 0 0-22-23Z" fill="#63ff8f"/>
      <path d="M0 119 22 23 0 0-22 23Z" fill="#e8eef2" fill-opacity="0.65"/>
      <circle r="10" fill="#080c0f" stroke="#63ff8f" stroke-width="4"/>
      <circle cx="-112" cy="-72" r="7" fill="#63ff8f"/>
      <circle cx="121" cy="-42" r="7" fill="#7fb2d8"/>
      <circle cx="102" cy="92" r="7" fill="#e8eef2"/>
      <text x="0" y="-166" fill="#8e9ba4" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">SIGNALS</text>
      <text x="0" y="190" fill="#8e9ba4" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">EVIDENCE</text>
    </g>
  </g>
</svg>
