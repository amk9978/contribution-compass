name: Contribution Compass

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-compass
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Collect project updates and contribution leads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run contribution-compass collect
      - name: Commit evidence, context, and event trail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ .state/
          if git diff --cached --quiet; then
            echo "No evidence or state changes"
          else
            git commit -m "compass: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
