name: Engineering Radar

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engineering-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm start
      - name: Commit collected data and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ .state/
          if git diff --cached --quiet; then
            echo "No report or state changes"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
