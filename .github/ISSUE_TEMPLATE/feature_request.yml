name: Feature request
description: Propose a focused improvement to personalized OSS investment recommendations.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
        - label: I read the v2 product specification and this preserves project-first evaluation.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Investment decision problem
      description: What decision about sustained open-source contribution is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest useful implementation, not a broad product wishlist.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Link to relevant developers, repositories, measurements, or recommendation cases.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and tradeoffs
      description: What should remain out of scope? Which signal would materially change a recommendation?
